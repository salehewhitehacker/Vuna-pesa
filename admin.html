<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Vuna Pesa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.admin-badge { font-size: 0.9em; }</style>
</head>
<body>
<div class="container mt-4">
  <div id="admin-login" class="row justify-content-center">
    <div class="col-md-5 card p-4">
      <h3 class="text-warning fw-bold">Admin Login</h3>
      <form onsubmit="return adminLogin(event)">
        <input class="form-control mb-3" placeholder="Username" id="adminUser" required>
        <input class="form-control mb-3" placeholder="Password" id="adminPass" type="password" required>
        <button class="btn btn-warning w-100">Ingia</button>
      </form>
    </div>
  </div>
  <div id="admin-dashboard" style="display:none;">
    <h2 class="text-warning mt-3">Welcome, Admin <span class="admin-badge badge bg-warning text-dark">salehe</span></h2>
    <section class="mb-4">
      <h4>Users Management</h4>
      <table class="table table-bordered">
        <thead><tr><th>Jina</th><th>Namba</th><th>Email</th><th>Salio</th><th>Status</th><th>Action</th><th>Message</th><th>Punguza Salio</th></tr></thead>
        <tbody id="usersTable"><tr><td>John Doe</td><td>0712345678</td><td>john@email.com</td><td>50,000</td><td><span class="badge bg-success">Active</span></td><td><button class="btn btn-sm btn-danger">Block</button><button class="btn btn-sm btn-info">View</button></td><td><button class="btn btn-sm btn-warning">Tuma</button></td><td><button class="btn btn-sm btn-secondary">Punguza</button></td></tr></tbody>
      </table>
      <button class="btn btn-primary mb-3" onclick="broadcastMsg()">Tuma Msg Wote</button>
    </section>
    <section class="mb-4">
      <h4>Vocha Management</h4>
      <input class="form-control mb-2" placeholder="Namba ya Vocha">
      <textarea class="form-control mb-2" placeholder="Maandishi ya vocha..."></textarea>
      <button class="btn btn-warning">Hifadhi/Edit Vocha</button>
    </section>
    <section class="mb-4">
      <h4>Survey Control</h4>
      <button class="btn btn-success mb-2">Washa Survey</button>
      <button class="btn btn-danger mb-2">Zima Survey</button>
    </section>
    <section class="mb-4">
      <h4>Order & Withdrawals</h4>
      <div class="mb-2"><strong>Order Pending:</strong><button class="btn btn-warning btn-sm">Activate</button><button class="btn btn-danger btn-sm">Cancel</button></div>
      <div class="mb-2"><strong>Withdrawals:</strong><button class="btn btn-success btn-sm">Approve</button><button class="btn btn-danger btn-sm">Cancel</button><span class="small text-muted">(Automatic/24h delay options available)</span></div>
    </section>
    <section class="mb-4">
      <h4>Payment Integration</h4>
      <input class="form-control mb-2" placeholder="Consumer Key">
      <input class="form-control mb-2" placeholder="Secret Key" type="password">
      <input class="form-control mb-2" placeholder="Payment Domain / Callback URL">
      <button class="btn btn-info">Hifadhi API Settings</button>
    </section>
  </div>
</div>
<script>
function adminLogin(event) {
  event.preventDefault();
  const user = document.getElementById('adminUser').value;
  const pass = document.getElementById('adminPass').value;
  if(user === "salehe" && pass === "passord2008") {
    document.getElementById('admin-login').style.display="none";
    document.getElementById('admin-dashboard').style.display="block";
  } else {
    alert("Wrong username or password!");
  }
}
function broadcastMsg(){alert("Broadcast message sent!");}
</script>
</body>
</html>
